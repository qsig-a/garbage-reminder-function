name: Deploy to Google Cloud Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    name: Deploy Cloud Function
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout@v6.0.2
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Pinned to google-github-actions/auth@v3.0.0
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # Mask sensitive GCP Project Identifiers in console logs
      - name: Mask GCP Project Identifiers
        run: |
          SA_EMAIL="${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}"
          if [ ! -z "$SA_EMAIL" ]; then
            PROJECT_ID=$(echo "$SA_EMAIL" | cut -d'@' -f2 | cut -d'.' -f1)
            if [ ! -z "$PROJECT_ID" ]; then
              echo "::add-mask::$PROJECT_ID"
            fi
          fi
          if [ ! -z "$PROJECT_ID" ]; then
            PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format="value(projectNumber)" 2>/dev/null || true)
            if [ ! -z "$PROJECT_NUMBER" ]; then
              echo "::add-mask::$PROJECT_NUMBER"
            fi
          fi
        shell: bash

      # Pinned to google-github-actions/deploy-cloud-functions@v4.0.0
      - name: Deploy Cloud Function
        id: deploy
        uses: google-github-actions/deploy-cloud-functions@ab10d6b9be21630aafc15ced4c464c16cd6640d6
        with:
          name: 'garbage-reminder-function'
          runtime: 'python312'
          entry_point: 'main'
          region: ${{ vars.GCP_REGION || 'us-east1' }}
          # 2nd generation is the modern Google Cloud recommended standard
          # Customize 'gen2' or 'gen1' as per preference in GCF
          # Note: gen2 requires Cloud Run Admin and Artifact Registry permissions
          # for the service account running the deployment.
          # Change to gen1 if using 1st generation Cloud Functions.
          # Here we default to gen2 for best performance.
          # For more details, see the README.
          # To keep it backwards-compatible, gen1 can also be used. We'll default to gen2 but add notes.
          # We can also configure VPC settings or public accessibility:
          # allow_unauthenticated: false # recommended for cron/scheduler invocations
          # (To secure the function, you should invoke it via Cloud Scheduler with OIDC token auth)
          environment_variables: |
            CALENDAR_ID=${{ secrets.CALENDAR_ID }}
            SIGNALWIRE_PROJECT_ID=${{ secrets.SIGNALWIRE_PROJECT_ID }}
            SIGNALWIRE_TOKEN=${{ secrets.SIGNALWIRE_TOKEN }}
            SIGNALWIRE_SPACE_URL=${{ secrets.SIGNALWIRE_SPACE_URL }}
            SIGNALWIRE_FROM_NUMBER=${{ secrets.SIGNALWIRE_FROM_NUMBER }}
            UNIT_LIST_JSON=${{ secrets.UNIT_LIST_JSON }}

      # Clean up old Cloud Run revisions (Gen 2 functions)
      - name: Clean up old revisions
        if: success()
        run: |
          REGION="${{ vars.GCP_REGION || 'us-east1' }}"
          SERVICE_NAME="garbage-reminder-function"
          
          echo "Looking for old revisions of $SERVICE_NAME in $REGION..."
          # Fetch revisions, sort by creation time descending (newest first)
          REVISIONS=$(gcloud run revisions list --service="$SERVICE_NAME" --region="$REGION" --format="value(metadata.name)" --sort-by="~metadata.creationTimestamp" 2>/dev/null || true)
          
          if [ -z "$REVISIONS" ]; then
            echo "No revisions found or not a Cloud Run / Gen 2 function."
            exit 0
          fi
          
          KEEP=1
          COUNT=0
          for REVISION in $REVISIONS; do
            COUNT=$((COUNT+1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting old revision: $REVISION"
              gcloud run revisions delete "$REVISION" --region="$REGION" --quiet || true
            fi
          done
